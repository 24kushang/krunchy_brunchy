version: '3.8'

services:
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ${BACKEND_CONTAINER_NAME:-oms_backend}
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-postgres-db}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER:-admin}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-development_password}
      - DATABASE_NAME=${DATABASE_NAME:-oms_db}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}

  frontend-ui-non-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ${FRONTEND_CONTAINER_NAME:-oms_frontend_non_prod}
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-3001}
    depends_on:
      - backend-api

networks:
  default:
    name: ${NETWORK_NAME:-oms_network_prod}
    external: true
