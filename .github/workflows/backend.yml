name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: Run Jest Unit Tests
      run: |
        cd backend
        npm run test

    - name: Deploy Backend & DB to VM via SSH
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_SSH_HOST }}
        username: ${{ secrets.VM_SSH_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          # Determine target folder and project name based on branch
          if [ "${{ github.ref_name }}" = "main" ]; then
            PROJECT_PATH="${{ secrets.VM_PROJECT_PATH_PROD }}"
            COMPOSE_PROJECT="kbs-prod"
            BACKEND_PORT="3000"
            BACKEND_CONTAINER_NAME="oms_backend_prod"
            DB_CONTAINER_NAME="oms_postgres_prod"
            DB_HOST="${{ secrets.PROD_DATABASE_HOST }}"
            DB_PORT="${{ secrets.PROD_DATABASE_PORT }}"
            DB_USER="${{ secrets.PROD_DATABASE_USER }}"
            DB_PASSWORD="${{ secrets.PROD_DATABASE_PASSWORD }}"
            DB_NAME="${{ secrets.PROD_DATABASE_NAME }}"
            DB_SSL="${{ secrets.PROD_DATABASE_SSL }}"
            ORIGINS="${{ secrets.PROD_ALLOWED_ORIGINS }}"
          else
            PROJECT_PATH="${{ secrets.VM_PROJECT_PATH_DEV }}"
            COMPOSE_PROJECT="kbs-dev"
            BACKEND_PORT="3001"
            BACKEND_CONTAINER_NAME="oms_backend_dev"
            DB_CONTAINER_NAME="oms_postgres_dev"
            DB_HOST="${{ secrets.DEV_DATABASE_HOST }}"
            DB_PORT="${{ secrets.DEV_DATABASE_PORT }}"
            DB_USER="${{ secrets.DEV_DATABASE_USER }}"
            DB_PASSWORD="${{ secrets.DEV_DATABASE_PASSWORD }}"
            DB_NAME="${{ secrets.DEV_DATABASE_NAME }}"
            DB_SSL="${{ secrets.DEV_DATABASE_SSL }}"
            ORIGINS="${{ secrets.DEV_ALLOWED_ORIGINS }}"
          fi

          echo "Deploying branch '${{ github.ref_name }}' to '$PROJECT_PATH' with compose project '$COMPOSE_PROJECT'..."
          cd "$PROJECT_PATH"

          echo "Updating source code..."
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

          echo "Writing backend-api DB env for this deploy (Neon)..."
          {
            echo "BACKEND_PORT=$BACKEND_PORT"
            echo "BACKEND_CONTAINER_NAME=$BACKEND_CONTAINER_NAME"
            echo "DB_CONTAINER_NAME=$DB_CONTAINER_NAME"
            echo "DATABASE_HOST=$DB_HOST"
            echo "DATABASE_PORT=$DB_PORT"
            echo "DATABASE_USER=$DB_USER"
            echo "DATABASE_PASSWORD=$DB_PASSWORD"
            echo "DATABASE_NAME=$DB_NAME"
            echo "DATABASE_SSL=$DB_SSL"
            echo "ALLOWED_ORIGINS=$ORIGINS"
          } > .env

          echo "Starting Postgres database container..."
          docker compose -p "$COMPOSE_PROJECT" -f docker-compose.db.yml up -d
          
          echo "Building production backend image..."
          docker compose -p "$COMPOSE_PROJECT" build backend-api
          
          echo "Running database migrations..."
          docker compose -p "$COMPOSE_PROJECT" run --rm backend-api npm run migration:run:prod
          
          echo "Starting backend-api service..."
          docker compose -p "$COMPOSE_PROJECT" up -d --no-deps backend-api
          
          echo "Cleaning up unused Docker images..."
          docker image prune -f
          
          echo "Deployment of '${{ github.ref_name }}' completed successfully!"
