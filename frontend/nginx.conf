server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ─── Compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ─── PWA service worker: must always be revalidated ─────────────────────
    # These filenames are NOT content-hashed (sw.js/registerSW.js are fixed
    # names by design, so the browser knows where to look on every visit).
    # If cached long-lived like the hashed assets below, an installed PWA
    # would never see the service worker change and would get stuck on
    # whatever version first installed on the device — silently missing every
    # future deploy. Must come before the generic `*.js` cache rule (exact
    # `=` matches take priority over regex locations in nginx regardless of
    # file order, but keeping them first here for readability).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ─── Caching: versioned assets (hashed filenames) ───────────────────────
    # Vite appends content hashes to JS/CSS filenames → safe to cache forever
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── SPA fallback ───────────────────────────────────────────────────────
    # All other routes fall back to index.html so React Router handles them
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ─── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;
}
