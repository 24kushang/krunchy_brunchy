version: '3.8'

# ─── Production Compose Override ────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This replaces the dev frontend-ui service with a production nginx build.
# Backend + PostgreSQL are inherited unchanged from docker-compose.yml.

services:
  frontend-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: ${FRONTEND_CONTAINER_NAME:-oms_frontend_prod}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend-api
    restart: unless-stopped
